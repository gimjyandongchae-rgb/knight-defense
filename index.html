<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>기사 타워디펜스</title>
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:#1d2b1d;color:#fff;font-family:"Malgun Gothic",sans-serif;display:flex;flex-direction:column;align-items:center}
#bar,#sel{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:6px 8px;font-size:15px;width:100%;max-width:960px;box-sizing:border-box}
#wrap{position:relative;width:100%;max-width:960px}canvas{width:100%;display:block;touch-action:none}
#wave{position:absolute;top:8px;right:10px;background:#000a;padding:6px 14px;border-radius:8px;font-weight:bold;font-size:20px;letter-spacing:1px}
button{font:inherit;padding:6px 12px;border-radius:6px;border:0;background:#e8b923;color:#222;font-weight:bold;cursor:pointer}button:disabled{opacity:.4}
label{display:flex;align-items:center;gap:4px}#hb{display:flex;gap:8px;padding:6px 8px;width:100%;max-width:960px;box-sizing:border-box}#hb .sl{width:56px;height:56px;border:2px solid #888;border-radius:8px;background:#0006;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:22px}#hb .sl.on{border-color:#ffd54a;background:#ffd54a33}#hb i{position:absolute;top:1px;left:5px;font-size:11px;font-style:normal;opacity:.8}#hb small{font-size:10px}#maps{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);display:none;gap:12px;z-index:3}#maps .mp{width:104px;height:104px;background:#000c;border:2px solid #ffd54a;border-radius:10px;color:#fff;text-align:center;cursor:pointer;font-weight:bold;padding:4px;box-sizing:border-box;font-size:14px}#maps canvas{width:88px;height:72px;display:block;border-radius:6px}#blk{position:absolute;inset:0;background:#000;color:#fff;display:none;align-items:center;justify-content:center;font-size:30px;z-index:9}#sp{position:absolute;right:10px;bottom:8px;background:#000b;color:#fff;border:2px solid #ffd54a;min-width:56px}#msg{position:absolute;left:50%;top:45%;transform:translate(-50%);font-size:38px;font-weight:bold;text-shadow:0 2px 6px #000;pointer-events:none;text-align:center}</style></head><body>
<div id="bar"><span>💰 <b id="co">50</b>원</span><span>🏰 기지 <b id="hp">100</b></span><button id="go">웨이브 시작</button>
<label><input type="checkbox" id="auto">자동웨이브</label><label>🔊<input type="range" id="vol" min="0" max="1" step="0.01" value="0.6"></label></div>
<div id="wrap"><canvas id="c" width="960" height="400"></canvas><button id="sp">x1</button><div id="wave">WAVE 1/30</div><div id="msg"></div><div id="maps"></div><div id="blk">맵이동중...</div></div>
<div id="hb"></div><div id="sel">빈 잔디를 눌러 기사(50원)를 배치하세요. 기사를 누르면 업그레이드할 수 있어요.</div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),$=id=>document.getElementById(id);
const PW=54,MAPS=[{n:'초원',P:[[0,70],[800,70],[800,196],[160,196],[160,322],[920,322]]},
{n:'사막',P:[[0,330],[90,330],[90,70],[250,70],[250,330],[410,330],[410,70],[570,70],[570,330],[730,330],[730,70],[890,70],[890,330]]},
{n:'도시',P:[[0,45],[780,45],[780,140],[160,140],[160,235],[780,235],[780,330],[920,330]]}],BG=[['#4a9a3c','#3e8532'],['#e6c98d','#d1ad6a'],['#4d535c','#3d424a']];
let P,seg,tot,MAP=0,deco=[],sd=1,fw=[],fwN=0,fwNext=0,won=false,moving=false;
function rnd(){sd=(sd*16807)%2147483647;return sd/2147483647}
function setMap(m){MAP=m;P=MAPS[m].P;seg=[];tot=0;for(let i=0;i<P.length-1;i++){const l=Math.hypot(P[i+1][0]-P[i][0],P[i+1][1]-P[i][1]);seg.push([P[i],P[i+1],l,tot]);tot+=l}
 deco=[];sd=7+m*13;const want=m==1?[['cactus',16]]:m==2?[['lamp',6],['car',3],['fire',4]]:[],L=P[P.length-1];
 for(const[t,n]of want){let c=0,k=0;while(c<n&&k++<800){const x=25+rnd()*910,y=30+rnd()*340,dp=distPath(x,y);if(dp<(t=='lamp'?38:46)||dp>(t=='lamp'?58:999)||Math.hypot(x-L[0],y-L[1])<70||deco.some(d=>Math.hypot(d.x-x,d.y-y)<(t=='car'?60:40)))continue;deco.push({t,x,y,r:t=='car'?30:t=='fire'?14:12,a:rnd()*.6-.3});c++}}
 for(const d of deco.filter(d=>d.t=='car'))deco.push({t:'fire',x:d.x+rnd()*16-8,y:d.y-8,r:0,a:0})}
setMap(0);
function pos(d){for(const s of seg)if(d<=s[3]+s[2]){const k=(d-s[3])/s[2];return[s[0][0]+(s[1][0]-s[0][0])*k,s[0][1]+(s[1][1]-s[0][1])*k]}return P[P.length-1]}
function distPath(x,y){let m=1e9;for(const s of seg){const[a,b]=s,dx=b[0]-a[0],dy=b[1]-a[1];let t=((x-a[0])*dx+(y-a[1])*dy)/(dx*dx+dy*dy);t=Math.max(0,Math.min(1,t));m=Math.min(m,Math.hypot(x-a[0]-dx*t,y-a[1]-dy*t))}return m}
const DMG=[8,14,20],RNG=[64,80,96],CD=[.6,.5,.4],UP=[50,100],ARM=['#8b5a2b','#b4bfcc','#f2c230'],ARN=['가죽','철','금'];
let coins=50,bhp=100,wave=0,T=0,en=[],tw=[],pend=[],fx=[],sel=null,hold=-1,over=false,mouse=null,msgT=0;
const grass=[];for(let i=0;i<260;i++)grass.push([Math.random()*960,Math.random()*400]);
function say(t,s=2){$('msg').textContent=t;msgT=s}
const SP=36,mh=w=>15*(1+.24*(Math.min(w,25)-1));let TG=[],spd=1;
$('sp').onclick=()=>{spd=spd%3+1;$('sp').textContent='x'+spd};
function startWave(){if(over||wave>=30||pend.length||en.length)return;wave++;initAudio();horn();let n=8+Math.floor(wave*1.7),a=[];
 for(let i=0;i<n;i++)a.push(0);if(wave>=6&&wave<=25)for(let i=0;i<Math.round(n*.4);i++)a.push(2);
 const m=wave>=21&&wave<=22?1:wave>=23&&wave<=26?2:wave>=27&&wave<=29?3:0;for(let i=0;i<m;i++)a.push(4);
 for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
 let t=T+1.5;if(wave==10||wave==30){pend.push({t,k:1});t+=1.5}if(wave==20){pend.push({t,k:3});t+=1.5}
 a.forEach((k,i)=>pend.push({t:t+i*.8,k}));say('WAVE '+wave,1.5);ui()}
$('go').onclick=startWave;
function mk(k){const h=mh(wave),b={d:0,k,hp:h,mx:h,ph:Math.random()*6,dmg:10,coin:10,sp:55+wave*.8};
 if(k==2)b.sp*=3;
 if(k==1){const H=(wave>=30?75:45)*h;Object.assign(b,{hp:H,mx:H,sp:32,dmg:999,coin:100,stop:8,stopT:0,shout:0,did:0})}
 if(k==3){const q=8*h;Object.assign(b,{hp:1,sg:Array(10).fill(q),mx:q,sp:45,alive:10,dmg:999,coin:0})}
 if(k==4){const H=10*h;Object.assign(b,{hp:H,mx:H,sp:26,dmg:25,coin:40})}
 return b}
function spawn(k){en.push(mk(k))}
function ui(){hbUp();$('co').textContent=coins;$('hp').textContent=bhp;$('wave').textContent='WAVE '+Math.max(1,wave)+'/30';$('go').disabled=over||wave>=30;
 const s=$('sel');if(sel){const L=sel.l;s.innerHTML='🗡 기사 ('+ARN[L]+'갑옷) 공격력 '+DMG[L]+' ';if(L<2){const b=document.createElement('button');b.textContent='업그레이드 '+UP[L]+'원 (공격력 '+DMG[L+1]+')';b.disabled=coins<UP[L];b.onclick=()=>{if(coins>=UP[L]){coins-=UP[L];sel.l++;ui()}};s.appendChild(b)}else s.append('(최대 레벨)')}
 else s.textContent=hold==0?'잔디를 눌러 기사를 배치하세요 (취소: Esc / 우클릭 / 1번 다시 클릭)':'아래 1번 칸을 눌러 기사(50원)를 선택하세요. 기사를 누르면 업그레이드할 수 있어요.'}
const hb=$('hb');for(let i=0;i<5;i++){const d=document.createElement('div');d.className='sl';d.innerHTML='<i>'+(i+1)+'</i>'+(i==0?'🗡<small>50원</small>':'');d.onclick=()=>pick(i);hb.appendChild(d)}
function pick(i){initAudio();if(i!=0)return;hold=hold==i?-1:i;sel=null;ui()}
function hbUp(){[...hb.children].forEach((d,i)=>d.classList.toggle('on',hold==i))}
addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='5')pick(+e.key-1);if(e.key=='Escape'){hold=-1;ui()}});
cv.oncontextmenu=e=>{e.preventDefault();hold=-1;ui()};
function xy(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*960/r.width,(e.clientY-r.top)*400/r.height]}
cv.onmousemove=e=>mouse=xy(e);cv.onmouseleave=()=>mouse=null;
cv.onclick=e=>{initAudio();if(over)return;const[x,y]=xy(e);mouse=[x,y];const t=tw.find(t=>Math.hypot(t.x-x,t.y-y)<24);
 if(t){sel=t;hold=-1;ui();return}if(hold!=0){if(sel){sel=null;ui()}return}
 if(!ok(x,y))return;if(coins<50){say('코인이 부족해요',1);return}coins-=50;tw.push({x,y,l:0,cd:0,sw:0});ui()}
function ok(x,y){const L=P[P.length-1];return x>20&&x<940&&y>20&&y<380&&distPath(x,y)>PW/2-3&&Math.hypot(x-L[0],y-L[1])>60&&!tw.some(t=>Math.hypot(t.x-x,t.y-y)<30)&&!deco.some(d=>Math.hypot(d.x-x,d.y-y)<d.r)}
// ---- audio
let ac,mg,nextT=0,stp=0;
function initAudio(){if(ac){if(ac.state!='running')ac.resume();return}ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=+$('vol').value;
 const c=ac.createDynamicsCompressor();mg.connect(c);c.connect(ac.destination);nextT=ac.currentTime+.1;setInterval(sched,60)}
$('vol').oninput=()=>{if(mg)mg.gain.value=+$('vol').value};
function note(type,f,t,d,v,lp,f2){const o=ac.createOscillator(),gn=ac.createGain(),fl=ac.createBiquadFilter();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
 fl.type='lowpass';fl.frequency.value=lp||2000;gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(v,t+.01);gn.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(fl);fl.connect(gn);gn.connect(mg);o.start(t);o.stop(t+d+.05)}
const ROOT=[55,43.65,49,41.2],RH=[1,0,1,1,0,1,0,1];
function sched(){while(nextT<ac.currentTime+.3){const s=stp%8,r=ROOT[Math.floor(stp/8)%4],t=nextT;
 if(RH[s]){note('sawtooth',r,t,.28,.5,260);note('sine',r,t,.3,.6,200)}
 if(s==0){note('sawtooth',r*4,t,2.3,.09,500);note('sawtooth',r*4*1.5,t,2.3,.06,500)}
 if(s==0||s==3||s==4)note('sine',130,t,.22,s==3?.7:1,400,38);
 if(s==6)note('sine',95,t,.25,.7,300,45);
 nextT+=.3;stp++}}
let lastC=0;function clang(){if(!ac||ac.currentTime-lastC<.04)return;lastC=ac.currentTime;const t=ac.currentTime;for(const[f,v]of[[3200,.13],[4700,.1],[6900,.07]])note('triangle',f*(.97+Math.random()*.06),t,.28,v,9000)}
function horn(){if(!ac)return;const t=ac.currentTime;for(const f of[98,98.8,147]){const o=ac.createOscillator(),gn=ac.createGain(),fl=ac.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(f*.93,t);o.frequency.linearRampToValueAtTime(f,t+.35);
 fl.type='lowpass';fl.frequency.value=700;gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(.35,t+.3);gn.gain.setValueAtTime(.35,t+1.1);gn.gain.linearRampToValueAtTime(0,t+1.7);o.connect(fl);fl.connect(gn);gn.connect(mg);o.start(t);o.stop(t+1.8)}}

function goMap(i){if(moving)return;moving=true;$('maps').style.display='none';$('msg').textContent='';$('blk').style.display='flex';setTimeout(()=>{setMap(i);resetGame();$('blk').style.display='none';moving=false},5000)}
function resetGame(){coins=50;bhp=100;wave=0;en=[];tw=[];pend=[];fx=[];fw=[];sel=null;hold=-1;over=false;won=false;$('msg').textContent='';$('maps').style.display='none';ui()}
MAPS.forEach((m,i)=>{const d=document.createElement('div');d.className='mp';const c=document.createElement('canvas');c.width=88;c.height=72;const x=c.getContext('2d'),k=88/960,oy=(72-400*k)/2;x.fillStyle=BG[i][0];x.fillRect(0,0,88,72);x.strokeStyle='#8a8a8a';x.lineWidth=5;x.beginPath();m.P.forEach((p,j)=>j?x.lineTo(p[0]*k,oy+p[1]*k):x.moveTo(p[0]*k,oy+p[1]*k));x.stroke();d.appendChild(c);d.append(m.n);d.onclick=()=>goMap(i);$('maps').appendChild(d)});
function fwUpd(dt){if(won&&fwN<8&&T>=fwNext){fwN++;fwNext=T+.55;const x=120+Math.random()*720,y=50+Math.random()*180,h=Math.random()*360;for(let i=0;i<44;i++){const a=i/44*6.283,v=70+Math.random()*90;fw.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1.5,c:'hsl('+(h+Math.random()*40)+',100%,60%)'})}if(ac)note('triangle',380+Math.random()*200,ac.currentTime,.25,.2,2500,90)}
 for(const p of fw){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=80*dt;p.l-=dt}fw=fw.filter(p=>p.l>0)}
function drawFw(){for(const p of fw){g.globalAlpha=Math.min(1,p.l);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,2.5,0,7);g.fill()}g.globalAlpha=1}
function drawDeco(){for(const d of deco){g.save();g.translate(d.x,d.y);
 if(d.t=='cactus'){g.fillStyle='#0003';g.beginPath();g.ellipse(0,4,12,4,0,0,7);g.fill();g.fillStyle='#2e8b3d';g.fillRect(-4,-28,8,32);g.beginPath();g.arc(0,-28,4,0,7);g.fill();g.fillRect(-14,-18,10,5);g.fillRect(-14,-28,5,15);g.fillRect(4,-14,10,5);g.fillRect(9,-24,5,14);g.fillStyle='#d6f0b8';for(let i=0;i<6;i++)g.fillRect(-2,-26+i*5,1.5,1.5)}
 else if(d.t=='lamp'){const gr=g.createRadialGradient(10,-32,1,10,-32,36);gr.addColorStop(0,'#ffe9a077');gr.addColorStop(1,'#ffe9a000');g.fillStyle=gr;g.fillRect(-30,-70,80,80);g.fillStyle='#222';g.fillRect(-1.5,-36,3,38);g.fillRect(-1.5,-36,12,3);g.fillStyle='#fff3b0';g.beginPath();g.arc(10,-32,3.5,0,7);g.fill()}
 else if(d.t=='car'){g.rotate(d.a);g.fillStyle='#0005';g.beginPath();g.ellipse(0,10,28,5,0,0,7);g.fill();g.fillStyle='#6e3b2e';g.fillRect(-24,-8,48,16);g.fillStyle='#5a2f25';g.fillRect(-12,-17,24,10);g.fillStyle='#8aa0ac';g.fillRect(-10,-15,9,6);g.fillRect(1,-15,9,6);g.strokeStyle='#fff';g.lineWidth=1;g.beginPath();g.moveTo(-9,-15);g.lineTo(-3,-9);g.moveTo(3,-15);g.lineTo(8,-9);g.stroke();g.fillStyle='#111';g.beginPath();g.ellipse(8,-2,11,5,0,0,7);g.fill();g.fillRect(-24,2,12,6);g.beginPath();g.arc(-14,9,5,0,7);g.fill();g.fillStyle='#333';g.fillRect(12,6,10,3)}
 else{const gr=g.createRadialGradient(0,-8,1,0,-8,26);gr.addColorStop(0,'#ff8a0066');gr.addColorStop(1,'#ff8a0000');g.fillStyle=gr;g.fillRect(-28,-36,56,56);const c=['#e22','#f80','#fe3'];for(let k=0;k<3;k++){const h=(16+8*Math.sin(T*11+k*2+d.x))*(1-k*.25),w=9-k*2.5;g.fillStyle=c[k];g.beginPath();g.moveTo(-w,0);g.quadraticCurveTo(-w,-h*.6,Math.sin(T*8+k)*2,-h);g.quadraticCurveTo(w,-h*.6,w,0);g.closePath();g.fill()}}
 g.restore()}}
// ---- update
function targets(){const a=[];for(const e of en){if(e.k==3){for(let i=0;i<10;i++)if(e.sg[i]>0){const d=e.d-i*SP;if(d>=0)a.push({e,i,d})}}else a.push({e,d:e.d})}return a}
function alive(q){return q.e.k==3?q.e.sg[q.i]>0:q.e.hp>0}
function hit(q,dm){const e=q.e;if(e.k==3){e.sg[q.i]-=dm;if(e.sg[q.i]<=0){e.sp*=1.05;e.alive--;coins+=20;const[x,y]=pos(q.d);fx.push({x,y:y-20,k:'txt',s:'+20',t:0});if(!e.alive){e.gone=1;if(wave==20)spawn(4)}ui()}}else e.hp-=dm}
function upd(dt){T+=dt;
 while(pend.length&&pend[0].t<=T)spawn(pend.shift().k);
 for(const e of en){if(e.k==1){if(e.stopT>0){e.stopT-=dt;e.shout=1;if(!e.did&&e.stopT<.8){e.did=1;for(let i=0;i<3;i++){const m=mk(0);m.d=Math.max(0,e.d-i*14);en.push(m)}fx.push({x:pos(e.d)[0],y:pos(e.d)[1],r:10,k:'ring'})}continue}e.shout=0;e.stop-=dt;if(e.stop<=0){e.stop=8;e.stopT=1.4;e.did=0}}
  e.d+=e.sp*dt;if(e.d>=tot&&!e.gone){e.gone=1;bhp-=e.dmg;if(bhp<=0){bhp=0;over=true;say(e.dmg>=999?'보스가 기지에 도달했다! 게임 오버':'게임 오버',99)}ui()}}
 TG=targets();
 for(const t of tw){t.cd-=dt;t.sw-=dt;if(t.cd<=0){let b=null;for(const q of TG){if(!alive(q))continue;const[x,y]=pos(q.d);if(Math.hypot(x-t.x,y-t.y)<RNG[t.l]&&(!b||q.d>b.d))b=q}
  if(b){hit(b,DMG[t.l]);t.cd=CD[t.l];t.sw=.2;clang();const[x,y]=pos(b.d);t.face=x<t.x?-1:1;fx.push({x,y:y-10,r:4,k:'hit'})}}}
 for(const e of en)if(e.hp<=0&&!e.gone){e.gone=1;coins+=e.coin;const[x,y]=pos(e.d);fx.push({x,y:y-20,k:'txt',s:'+'+e.coin,t:0});ui()}
 en=en.filter(e=>!e.gone);
 for(const f of fx){f.t=(f.t||0)+dt;if(f.k=='ring')f.r+=120*dt}fx=fx.filter(f=>f.t<(f.k=='txt'?.9:.4));
 fwUpd(dt);$('go').disabled=over||wave>=30||pend.length>0||en.length>0;
 if(msgT>0&&!over){msgT-=dt;if(msgT<=0)$('msg').textContent=''}
 if(!over&&wave>=30&&!pend.length&&!en.length){over=true;won=true;fwN=0;fwNext=T;say('🎉 축하합니다! 30웨이브 클리어!',99);$('maps').style.display='flex';ui()}
 else if($('auto').checked&&!over&&wave<30&&!pend.length&&!en.length&&wave>0)startWave()}
// ---- draw
function bar(x,y,w,r){g.fillStyle='#400';g.fillRect(x-w/2,y,w,4);g.fillStyle='#3d3';g.fillRect(x-w/2,y,w*Math.max(0,r),4)}
function drawRun(e){const f=e.k==2,[x,y]=pos(e.d),dir=pos(e.d+4)[0]<x-.5?-1:1,ph=T*(f?24:16)+e.ph,bob=Math.abs(Math.sin(ph))*(f?3:5),col=f?'#2a6fd8':'#111',ol=f?'#9cf':'#444';
 g.save();g.translate(x,y);g.scale(dir,1);g.fillStyle='#0004';g.beginPath();g.ellipse(0,15,12,3,0,0,7);g.fill();
 if(f){g.strokeStyle='#fff6';g.lineWidth=2;g.beginPath();g.moveTo(-16,-8);g.lineTo(-30,-8);g.moveTo(-16,0);g.lineTo(-26,0);g.stroke()}
 g.strokeStyle=col;g.lineWidth=4;g.lineCap='round';
 for(const k of[-1,1]){const p=ph+(k>0?Math.PI:0),a=Math.sin(p),lift=Math.max(0,Math.cos(p))*5;g.beginPath();g.moveTo(k*3,6-bob);g.lineTo(k*3+a*11,14-lift);g.stroke()}
